<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<figure style="margin:0;position:relative;width:100%;height:{{ h }};aspect-ratio:{{ ratio }};overflow:hidden;background-color:{{ bg }};">
  <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" srcset="{{ srcset }}" sizes="{{ sizes }}" alt="{{ alt }}" loading="{{ loading }}" decoding="async" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:{{ pos }};">
  </sc-if>
  <sc-if value="{{ noSrc }}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="{{ alt }}" style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:{{ stripes }};"></div>
    <div style="position:absolute;top:12px;left:12px;right:12px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-variant-numeric:tabular-nums;font-size:11px;line-height:1.4;letter-spacing:0.06em;text-transform:uppercase;color:{{ fg }};text-wrap:pretty;">{{ label }}</div>
  </sc-if>
  <figcaption style="position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:4px 8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-variant-numeric:tabular-nums;font-size:11px;line-height:1.3;color:oklch(0.96 0.006 85);background:oklch(0.12 0.004 270 / 0.78);">Foto: {{ credit }}</figcaption>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:450},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Foto de escena&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;credit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Nombre del fotógrafo]&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ratio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4 / 5&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;warm&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;srcset&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sizes&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100vw&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lazy&quot;,&quot;eager&quot;],&quot;default&quot;:&quot;lazy&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const warm = p.tone === 'warm';
    const fill = !p.ratio || p.ratio === 'auto';
    return {
      h: fill ? '100%' : 'auto',
      ratio: fill ? 'auto' : p.ratio,
      bg: warm ? 'oklch(0.86 0.04 72)' : 'oklch(0.23 0.006 270)',
      stripes: warm
        ? 'repeating-linear-gradient(135deg, oklch(0.81 0.05 68) 0 1px, transparent 1px 11px)'
        : 'repeating-linear-gradient(135deg, oklch(0.27 0.006 270) 0 1px, transparent 1px 11px)',
      fg: warm ? 'oklch(0.3 0.04 50)' : 'oklch(0.8 0.01 85)',
      hasSrc: !!p.src, noSrc: !p.src,
      src: p.src, srcset: p.srcset, sizes: p.sizes || '100vw',
      alt: p.alt || '', label: p.label || 'Foto de escena',
      credit: p.credit || '[Nombre del fotógrafo]',
      loading: p.loading || 'lazy', pos: p.pos || '50% 50%'
    };
  }
}
</script>
</body>
</html>
